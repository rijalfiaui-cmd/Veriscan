<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="mbgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#111827" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#mbgGrad)" opacity="0.15" />

  <!-- Outer Wreath / Circle -->
  <circle cx="60" cy="60" r="38" stroke="url(#mbgGrad)" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.6" />

  <!-- Center Nutrition / Rice Bowl / Sparkle Motif -->
  <!-- Bowl Shape -->
  <path d="M 36 60 Q 36 82 60 82 Q 84 82 84 60 Z" fill="url(#mbgGrad)" filter="url(#glowGreen)" />
  <!-- Bowl Rim -->
  <ellipse cx="60" cy="60" rx="24" ry="4" fill="#34d399" />
  
  <!-- Steam / Leaf / Energy Star above bowl -->
  <path d="M 60 34 C 64 42 70 44 70 50 C 70 55 65 57 60 57 C 55 57 50 55 50 50 C 50 44 56 42 60 34 Z" fill="#ffffff" />
  <circle cx="60" cy="46" r="3" fill="#065f46" />

  <!-- Stars / Leaves -->
  <circle cx="44" cy="45" r="2.5" fill="#34d399" />
  <circle cx="76" cy="45" r="2.5" fill="#34d399" />
</svg>
