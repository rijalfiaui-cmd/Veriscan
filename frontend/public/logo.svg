<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="absenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#111827" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#absenGrad)" opacity="0.15" />

  <!-- Outer QR Scanner Corners -->
  <path d="M 28 42 L 28 32 A 4 4 0 0 1 32 28 L 42 28" stroke="url(#absenGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 78 28 L 88 28 A 4 4 0 0 1 92 32 L 92 42" stroke="url(#absenGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 92 78 L 92 88 A 4 4 0 0 1 88 92 L 78 92" stroke="url(#absenGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 42 92 L 32 92 A 4 4 0 0 1 28 88 L 28 78" stroke="url(#absenGrad)" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- Center QR Matrix & Checkmark Badge -->
  <!-- Top Left Node -->
  <rect x="38" y="38" width="14" height="14" rx="3" fill="url(#absenGrad)" />
  <rect x="42" y="42" width="6" height="6" rx="1" fill="#111827" />

  <!-- Top Right Node -->
  <rect x="68" y="38" width="14" height="14" rx="3" fill="url(#absenGrad)" />
  <rect x="72" y="42" width="6" height="6" rx="1" fill="#111827" />

  <!-- Bottom Left Node -->
  <rect x="38" y="68" width="14" height="14" rx="3" fill="url(#absenGrad)" />
  <rect x="42" y="72" width="6" height="6" rx="1" fill="#111827" />

  <!-- Center Verification Checkmark Shield -->
  <circle cx="68" cy="68" r="14" fill="url(#absenGrad)" filter="url(#glow)" />
  <path d="M 62 68 L 66 72 L 74 63" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
